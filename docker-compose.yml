# Local development services for the portal.
# Run: `docker compose up -d`
# Stop: `docker compose down`
# Wipe data: `docker compose down -v`

services:
  postgres:
    image: postgres:16-alpine
    container_name: falcons-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     falcons
      POSTGRES_PASSWORD: falcons
      POSTGRES_DB:       falcons_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcons -d falcons_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: falcons-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

volumes:
  postgres-data:
    name: falcons-postgres-data
